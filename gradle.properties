# Run Gradle (and the test JVMs it forks) on the WPILib JDK.
#
# Without this, Gradle falls back to JAVA_HOME, which on a development
# laptop is often another JDK (the Android Studio JetBrains runtime, for
# one, bundles an msvcp140.dll too old for WPILib's native libraries and
# hard-crashes the JVM the moment a unit test loads wpiHal).
# C:/Users/Public/wpilib/<year>/jdk is the standard WPILib installation
# path on every Windows FRC machine. On macOS / Linux, or with WPILib
# installed elsewhere, override this line in ~/.gradle/gradle.properties
# (it takes precedence over this file) or edit it here.
org.gradle.java.home=C:/Users/Public/wpilib/2026/jdk
