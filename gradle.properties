# Run Gradle (and the test JVMs it forks) on the WPILib JDK.
#
# Without this, Gradle falls back to JAVA_HOME - on this machine the
# Android Studio JetBrains runtime - whose bundled msvcp140.dll is too old
# for WPILib's native libraries and hard-crashes the JVM the moment a unit
# test loads wpiHal. C:/Users/Public/wpilib/<year>/jdk is the standard
# WPILib installation path on every Windows FRC machine.
org.gradle.java.home=C:/Users/Public/wpilib/2026/jdk
